name: Sync FanQieNovel modules

on:
  schedule:
    - cron: "45 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sync module
        run: python "Surge/模块-番茄小说去广告/sync.py"
      - name: Verify generated module
        run: python "Surge/模块-番茄小说去广告/sync.py" --dry-run
      - name: Commit updates
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Surge/模块-番茄小说去广告" "Loon/模块-番茄小说去广告"
          git commit -m "Sync FanQieNovel modules"
          git push
