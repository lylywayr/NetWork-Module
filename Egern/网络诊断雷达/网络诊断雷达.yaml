# ==========================================
# 📌 模块名称: 网络诊断雷达
# ✨ 主要功能: 出口 IP / 延迟 / UDP-QUIC / 流媒体 / AI 可用性一屏检测，支持按策略组探测与 IP 打码。
# ⏱️ 更新时间: 2026.11.24
# ==========================================

name: "网络诊断雷达"
description: "出口 IP、延迟、UDP/QUIC、流媒体与 AI 可用性检测，可指定策略组并支持 IP 打码。"

auto_update:
  interval: 21600

env_schema:
  POLICY:
    name: 🎯 全局策略组
    description: "最高优先级。设置后出口、延迟、UDP/QUIC、流媒体、AI 全部统一走该策略组"
    default_value: ""
  LMT:
    name: 🎬 流媒体检测策略组
    description: "POLICY 为空时生效"
    default_value: ""
  AI:
    name: 🤖 AI 检测策略组
    description: "POLICY 为空时生效"
    default_value: ""
  YS:
    name: 🕶️ IP 打码
    description: "1 = 打码（123.123.*.*），0 或不填 = 不打码"
    options: ["0", "1"]
    default_value: "0"
  XY:
    name: 🔌 协议标识
    description: "手动指定协议，如 VLESS / Trojan / HY2 / AnyTLS；留空则自动识别"
    default_value: ""

scriptings:
  - generic:
      name: 网络诊断雷达
      script_url: https://raw.githubusercontent.com/lylywayr/NetWork-Module/main/Egern/%E7%BD%91%E7%BB%9C%E8%AF%8A%E6%96%AD%E9%9B%B7%E8%BE%BE/%E7%BD%91%E7%BB%9C%E8%AF%8A%E6%96%AD%E9%9B%B7%E8%BE%BE.js
      timeout: 30

widgets:
  - name: 网络诊断雷达
    script_name: 网络诊断雷达
